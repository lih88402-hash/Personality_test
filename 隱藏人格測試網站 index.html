<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>你的隱藏人格是什麼？</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#363a40;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}

</style></head><body><div class="wrap">

<section id="start" class="card center"><h1>你的隱藏人格是什麼？</h1>
<p>30 道題目，看看你的主人格、副人格，以及藏在更深處的性格。</p>
<button id="startBtn">開始測試</button><p class="small">娛樂性測試，結果僅供參考。</p></section>

<section id="quiz" class="card hidden"><div class="progressTop"><span id="num"></span><span id="pct"></span></div>
<div class="progress"><div id="progress" class="bar"></div></div><div id="question" class="q"></div>
<div id="options" class="options"></div><div id="notice"></div>
<div class="nav"><button id="prev" class="secondary">上一題</button><button id="next">下一題</button></div></section>

<section id="result" class="card hidden"><div class="center"><p class="small">測試結果</p><h1>你的主人格</h1>
<div class="result"><div id="main" class="main"></div><p id="desc"></p><div id="tags"></div></div></div>
<h2>人格排序</h2><div id="ranking"></div><div class="center" style="margin-top:28px"><button id="again">重新測試</button></div></section>
</div>

<script>

const maps=[["病嬌系", "冷淡系", "社恐系", "神秘系", "完美系"], ["溫柔系", "浪漫系", "樂觀系", "野心系", "觀察系"], ["黏人系", "毒舌系", "正義系", "冒險系", "戲精系"], ["社牛系", "悲觀系", "自由系", "忠誠系", "天然系"], ["敏感系", "慵懶系", "治癒系", "病嬌系", "冷淡系"], ["神秘系", "完美系", "獨立系", "溫柔系", "浪漫系"], ["野心系", "觀察系", "腹黑系", "黏人系", "毒舌系"], ["冒險系", "戲精系", "傲嬌系", "社牛系", "悲觀系"], ["忠誠系", "天然系", "理智系", "敏感系", "慵懶系"], ["病嬌系", "冷淡系", "社恐系", "神秘系", "完美系"], ["溫柔系", "浪漫系", "樂觀系", "野心系", "觀察系"], ["黏人系", "毒舌系", "正義系", "冒險系", "戲精系"], ["社牛系", "悲觀系", "自由系", "忠誠系", "天然系"], ["敏感系", "慵懶系", "治癒系", "病嬌系", "冷淡系"], ["神秘系", "完美系", "獨立系", "溫柔系", "浪漫系"], ["野心系", "觀察系", "腹黑系", "黏人系", "毒舌系"], ["冒險系", "戲精系", "傲嬌系", "社牛系", "悲觀系"], ["忠誠系", "天然系", "理智系", "敏感系", "慵懶系"], ["病嬌系", "冷淡系", "社恐系", "神秘系", "完美系"], ["溫柔系", "浪漫系", "樂觀系", "野心系", "觀察系"], ["黏人系", "毒舌系", "正義系", "冒險系", "戲精系"], ["社牛系", "悲觀系", "自由系", "忠誠系", "天然系"], ["敏感系", "慵懶系", "治癒系", "病嬌系", "冷淡系"], ["神秘系", "完美系", "獨立系", "溫柔系", "浪漫系"], ["野心系", "觀察系", "腹黑系", "黏人系", "毒舌系"], ["冒險系", "戲精系", "傲嬌系", "社牛系", "悲觀系"], ["忠誠系", "天然系", "理智系", "敏感系", "慵懶系"], ["病嬌系", "冷淡系", "社恐系", "神秘系", "完美系"], ["溫柔系", "浪漫系", "樂觀系", "野心系", "觀察系"], ["黏人系", "毒舌系", "正義系", "冒險系", "戲精系"]];
const types=["病嬌系", "腹黑系", "天然系", "溫柔系", "傲嬌系", "冷淡系", "黏人系", "理智系", "浪漫系", "社牛系", "社恐系", "毒舌系", "敏感系", "樂觀系", "悲觀系", "神秘系", "正義系", "慵懶系", "野心系", "自由系", "完美系", "冒險系", "治癒系", "觀察系", "忠誠系", "獨立系", "戲精系"];
const desc={"病嬌系": "感情濃度較高，重視專一與連結，一旦認定就不容易放下。", "腹黑系": "表面平靜，心裡卻常常想得很多，擅長觀察局勢。", "天然系": "真誠自然，依照直覺行動，有時反應讓人意外。", "溫柔系": "很容易注意別人的感受，習慣溫和地陪伴身邊的人。", "傲嬌系": "不太習慣直接表達在乎，嘴上可能很硬，行動卻很誠實。", "冷淡系": "不喜歡過度表露自己，建立信任需要時間。", "黏人系": "重視陪伴與安全感，喜歡和重要的人保持聯繫。", "理智系": "遇到事情會先分析，再決定怎麼做。", "浪漫系": "容易被細節、氛圍與真誠的情感打動。", "社牛系": "比較敢主動交流，面對陌生環境也能快速融入。", "社恐系": "面對陌生環境會先觀察，熟悉後才會放鬆。", "毒舌系": "說話直接、反應快，偶爾一句吐槽就能抓到重點。", "敏感系": "很容易察覺語氣、表情和氣氛的細微變化。", "樂觀系": "習慣往前看，即使不順利也容易找到重新開始的方法。", "悲觀系": "習慣先想最壞的可能，因此做決定比較謹慎。", "神秘系": "不會把所有想法都說出來，需要相處才能真正了解。", "正義系": "重視原則與公平，遇到不合理的事情容易站出來。", "慵懶系": "不喜歡把生活排得太滿，更希望按照舒服的節奏生活。", "野心系": "有自己的目標，希望一步步證明自己的能力。", "自由系": "重視自己的選擇與空間，不喜歡被過度限制。", "完美系": "對自己要求較高，做事情會特別注意細節。", "冒險系": "喜歡新鮮感與挑戰，對未知事物容易產生好奇。", "治癒系": "重視情緒與陪伴，常能讓身邊的人感覺被理解。", "觀察系": "習慣先看、先聽、先理解，再決定怎麼行動。", "忠誠系": "一旦認定一段關係就會很珍惜，不容易輕易改變。", "獨立系": "習慣靠自己的力量處理問題，也珍惜自己的空間。", "戲精系": "情緒表現豐富，反應生動，生活裡很有自己的小劇場。"};
let current=0,answers=Array(30).fill(null);

const $=id=>document.getElementById(id);
function show(id){["start","quiz","result"].forEach(x=>$(x).classList.add("hidden"));$(id).classList.remove("hidden");}
function render(){
 const [q,opts]=questions[current]; $("num").textContent=(current+1)+" / 30";
 const percent=Math.round((current)/30*100);$("pct").textContent=percent+"%";$("progress").style.width=percent+"%";
 $("question").textContent=q;$("notice").textContent="";$("options").innerHTML="";
 opts.forEach((text,i)=>{const b=document.createElement("button");b.className="option"+(answers[current]===i?" selected":"");
 b.textContent=String.fromCharCode(65+i)+"　"+text;b.onclick=()=>{answers[current]=i;render()};$("options").appendChild(b)});
 $("prev").disabled=current===0;$("next").textContent=current===29?"查看結果":"下一題";
}
function start(){current=0;answers=Array(30).fill(null);show("quiz");render()}
function next(){
 if(answers[current]===null){$("notice").textContent="請先選擇這一題的答案。";return}
 if(current<29){current++;render()}else result();
}
function result(){
 const scores={};types.forEach(t=>scores[t]=0);
 answers.forEach((a,i)=>scores[maps[i][a]]++);
 const rank=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
 const main=rank[0][0];$("main").textContent=main;$("desc").textContent=desc[main];
 $("tags").innerHTML=["性格特徵","個人傾向","隱藏面"].map(x=>`<span class="tag">${x}</span>`).join("");
 $("ranking").innerHTML=rank.slice(0,8).map((r,i)=>`<div class="row"><span>${i===0?"主人格":i===1?"副人格":i===2?"隱藏人格":i===3?"潛在人格":r[0]}</span><div class="rbar"><i style="width:${r[1]/30*100}%"></i></div><b>${r[1]}</b></div>`).join("");
 show("result");window.scrollTo(0,0);
}
$("startBtn").onclick=start;$("next").onclick=next;$("prev").onclick=()=>{if(current>0){current--;render()}};
$("again").onclick=start;
</script></body></html>
